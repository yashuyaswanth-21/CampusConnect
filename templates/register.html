
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | CampusConnect</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 20px; font-family: Arial, sans-serif;
      background: #f3f4fb; color: #20213a;
    }
    .card {
      width: 100%; max-width: 440px; background: white;
      padding: 32px; border-radius: 18px;
      box-shadow: 0 12px 40px #25234a12;
    }
    h1 { margin-top: 0; }
    .muted { color: #70718a; line-height: 1.5; }
    label { display: block; margin-top: 16px; font-weight: bold; }
    input {
      width: 100%; padding: 12px; margin-top: 7px;
      border: 1px solid #d9dbea; border-radius: 9px; font-size: 16px;
    }
    button {
      width: 100%; margin-top: 24px; padding: 13px;
      border: 0; border-radius: 9px; background: #6254dc;
      color: white; font-size: 16px; cursor: pointer;
    }
    a { color: #5144c8; }
    .flash { padding: 10px; margin: 12px 0; border-radius: 8px; }
    .error { background: #ffeded; color: #a32020; }
    .success { background: #e8f8ee; color: #17653a; }
  </style>
</head>
<body>
  <main class="card">
    <p><a href="{{ url_for('index') }}">← CampusConnect</a></p>
    <h1>Create your account</h1>
    <p class="muted">Join your campus community.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for kind, message in messages %}
        <div class="flash {{ kind }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post">
      <label for="username">Username</label>
      <input id="username" name="username" required maxlength="40"
             autocomplete="username">

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required maxlength="120"
             autocomplete="email">

      <label for="password">Password (minimum 8 characters)</label>
      <input id="password" name="password" type="password" required
             minlength="8" autocomplete="new-password">

      <label for="confirm_password">Confirm password</label>
      <input id="confirm_password" name="confirm_password" type="password"
             required minlength="8" autocomplete="new-password">

      <button type="submit">Create student account</button>
    </form>

    <p class="muted">Already registered?
      <a href="{{ url_for('login') }}">Log in</a>
    </p>
  </main>
</body>
</html>
